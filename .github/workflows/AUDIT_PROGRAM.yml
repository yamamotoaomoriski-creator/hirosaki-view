name: Hirosaki View Repository Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository audit
        shell: python
        run: |
          from pathlib import Path
          import re
          import unicodedata
          import sys

          ROOT = Path(".").resolve()
          errors = 0
          warnings = 0

          print("=" * 60)
          print("HIROSAKI VIEW — REPOSITORY AUDIT")
          print("=" * 60)

          # --------------------------------------------------
          # 1. 不可視Unicode / 正規化異常
          # --------------------------------------------------
          print("\n[1] PATH CHECK")

          suspicious_codes = {
              0x200B: "ZERO WIDTH SPACE",
              0x200C: "ZERO WIDTH NON-JOINER",
              0x200D: "ZERO WIDTH JOINER",
              0xFEFF: "ZERO WIDTH NO-BREAK SPACE / BOM",
          }

          for p in sorted(ROOT.rglob("*")):
              if ".git" in p.parts:
                  continue

              name = p.name
              found = []

              for ch in name:
                  if ord(ch) in suspicious_codes:
                      found.append(
                          f"U+{ord(ch):04X} {suspicious_codes[ord(ch)]}"
                      )

              normalized = unicodedata.normalize("NFC", name)

              if found:
                  warnings += 1
                  print(f"⚠ SUSPICIOUS PATH: {p.relative_to(ROOT)}")
                  for item in found:
                      print(f"    {item}")

              if normalized != name:
                  warnings += 1
                  print(
                      f"⚠ NORMALIZATION: {p.relative_to(ROOT)}"
                  )

          # --------------------------------------------------
          # 2. Markdownリンク検査
          # --------------------------------------------------
          print("\n[2] MARKDOWN LINK CHECK")

          link_pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')

          for md in sorted(ROOT.rglob("*.md")):
              if ".git" in md.parts:
                  continue

              try:
                  text = md.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              except Exception as e:
                  print(f"⚠ READ ERROR: {md}: {e}")
                  errors += 1
                  continue

              for line_no, line in enumerate(
                  text.splitlines(), 1
              ):
                  for match in link_pattern.finditer(line):
                      target = match.group(1).strip()

                      # 外部URL / アンカー / mailto / 特殊スパンタグ は除外
                      if target.startswith(
                          ("http://", "https://", "#", "mailto:", "start_span", "end_span")
                      ):
                          continue

                      # タイトル部分を除去
                      target_path = target.split()[0]

                      # URLエンコードされたものは一旦そのまま扱う
                      resolved = (
                          md.parent / target_path
                      ).resolve()

                      try:
                          resolved.relative_to(ROOT)
                      except ValueError:
                          warnings += 1
                          print(
                              f"⚠ OUTSIDE REPO: "
                              f"{md.relative_to(ROOT)}:"
                              f"{line_no} -> {target}"
                          )
                          continue

                      if not resolved.exists():
                          errors += 1
                          print(
                              f"✗ BROKEN LINK: "
                              f"{md.relative_to(ROOT)}:"
                              f"{line_no} -> {target}"
                          )

          # --------------------------------------------------
          # 3. 重要パス参照の検査
          # --------------------------------------------------
          print("\n[3] PATH REFERENCES")

          keywords = (
              "observations/",
              "experiments/",
              "実験/",
              "docs/",
              "runs/",
          )

          for md in sorted(ROOT.rglob("*.md")):
              if ".git" in md.parts:
                  continue

              text = md.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for line_no, line in enumerate(
                  text.splitlines(), 1
              ):
                  if any(k in line for k in keywords):
                      print(
                          f"  {md.relative_to(ROOT)}:"
                          f"{line_no}: {line}"
                      )

          # --------------------------------------------------
          # 4. 観測ログの基本形式チェック
          # --------------------------------------------------
          print("\n[4] OBSERVATION FILE CHECK")

          observation_dirs = [
              p for p in ROOT.iterdir()
              if p.is_dir()
              and (
                  p.name == "observations"
                  or "observations" in p.name
              )
          ]

          for obs_dir in sorted(observation_dirs):
              print(
                  f"  Checking: "
                  f"{obs_dir.relative_to(ROOT)}"
              )

              for md in sorted(obs_dir.rglob("*.md")):
                  text = md.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  # 完全なスキーマ強制ではなく、
                  # 明らかな欠落だけ検出する。
                  required_candidates = [
                      "観測日時",
                      "場所",
                      "観測対象",
                  ]

                  missing = [
                      x for x in required_candidates
                      if x not in text
                  ]

                  if missing:
                      warnings += 1
                      print(
                          f"  ⚠ FORMAT: "
                          f"{md.relative_to(ROOT)}"
                      )
                      print(
                          f"      missing: "
                          f"{', '.join(missing)}"
                      )

          # --------------------------------------------------
          # 5. フィード同期検査 (RSS/Atom Feed Sync Check)
          # --------------------------------------------------
          print("\n[5] FEED SYNC CHECK")

          feed_xml_path = ROOT / "feed.xml"
          feed_atom_path = ROOT / "feed.atom"

          if not feed_xml_path.exists():
              errors += 1
              print("✗ MISSING FILE: feed.xml does not exist in root directory.")
          else:
              print("  ✓ feed.xml found")

          if not feed_atom_path.exists():
              errors += 1
              print("✗ MISSING FILE: feed.atom does not exist in root directory.")
          else:
              print("  ✓ feed.atom found")

          # Import and run feed generator logic to verify exact content match
          sys.path.insert(0, str(ROOT / "scripts"))
          try:
              import generate_feed
              obs_files = [
                  str(p) for p in sorted((ROOT / "observations").glob("*.md"))
                  if p.name != "index.md"
              ]
              items = [generate_feed.parse_md_file(f) for f in obs_files]
              expected_rss = generate_feed.build_rss_feed(items)
              expected_atom = generate_feed.build_atom_feed(items)

              if feed_xml_path.exists():
                  actual_rss = feed_xml_path.read_text(encoding="utf-8")
                  # Ignore lastBuildDate differences in comparison
                  clean_expected_rss = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '', expected_rss)
                  clean_actual_rss = re.sub(r'<lastBuildDate>.*?</lastBuildDate>', '', actual_rss)
                  if clean_expected_rss != clean_actual_rss:
                      errors += 1
                      print("✗ FEED OUT OF SYNC: feed.xml is not in sync with observations/*.md")
                  else:
                      print("  ✓ feed.xml is in exact sync with observations")

              if feed_atom_path.exists():
                  actual_atom = feed_atom_path.read_text(encoding="utf-8")
                  clean_expected_atom = re.sub(r'<updated>.*?</updated>', '', expected_atom)
                  clean_actual_atom = re.sub(r'<updated>.*?</updated>', '', actual_atom)
                  if clean_expected_atom != clean_actual_atom:
                      errors += 1
                      print("✗ FEED OUT OF SYNC: feed.atom is not in sync with observations/*.md")
                  else:
                      print("  ✓ feed.atom is in exact sync with observations")
          except Exception as e:
              errors += 1
              print(f"✗ FEED GENERATOR ERROR: {e}")

          # --------------------------------------------------
          # 6. 結果
          # --------------------------------------------------
          print("\n" + "=" * 60)
          print("AUDIT RESULT")
          print("=" * 60)

          print(f"Errors   : {errors}")
          print(f"Warnings : {warnings}")

          if errors:
              print("\n❌ AUDIT FAILED")
              print(
                  "Broken references or other "
                  "blocking errors were detected."
              )
              sys.exit(1)

          if warnings:
              print("\n⚠ AUDIT PASSED WITH WARNINGS")
              print(
                  "Warnings require human/design review."
              )
          else:
              print("\n✓ AUDIT CLEAN")

          print("=" * 60)
