name: Markdown Auto Register

on:
  issues:
    types: [labeled]

jobs:
  create-file:
    if: github.event.label.name == 'register-md'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute File Registration
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.trim();
            const body = context.payload.issue.body || '';
            const issueNumber = context.payload.issue.number;
            
            if (!title.endsWith('.md') || title.includes('..') || title.startsWith('/')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ 登録失敗: タイトルには「directory/filename.md」形式の有効なMarkdownパスを指定してください。（入力値: ${title}）`
              });
              setFailed('Invalid file path format.');
              return;
            }

            try {
              let existingFileSha = null;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: title,
                });
                existingFileSha = data.sha;
              } catch (e) {
                // File does not exist, proceed to create
              }

              if (existingFileSha) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `⚠️ 登録中断: '${title}' は既に存在します。上書きを防ぐため処理を中断しました。`
                });
                setFailed('File already exists. Overwrite prevented.');
                return;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: title,
                message: `auto-register: register ${title} via issue #${issueNumber}`,
                content: Buffer.from(body).toString('base64'),
                branch: 'main'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `✅ 成功: '${title}' をリポジトリに正常に登録しました。`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });

            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ エラー発生: ファイル登録中に予期せぬエラーが発生しました。\n\`\`\`${error.message}\`\`\``
              });
              setFailed(error.message);
            }
