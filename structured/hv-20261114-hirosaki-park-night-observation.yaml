observation_facts:
  raw_title: 弘前公園 夜間景観・施設状態ルート観測記録（2026-11-14）
  overview:
  - '観測日時: 2026-11-14 20:02〜20:27'
  - '場所: 弘前公園（追手門外堀、追手門、園路、杉の大杉付近、二の丸未申櫓工事現場、本丸天守、蓮沼方向、東内門、南内門）'
  - '観測対象: 夜間ライトアップ、紅葉・黄葉、水面反射、園路照明、門・石垣等の構造物、工事現場、仮設設備、通行規制の状態'
  - '天候: 曇'
  - '観測者: Hirosaki-View'
  points:
  - point_id: HP-002
    location: 追手門前外堀・市役所側
    time: '20:02'
    statements:
    - 外堀沿いの樹木がライトアップされている。
    - 手前の樹木には黄葉した葉が残り、中景以降では落葉が進行している。
    - 水面にライトと樹木が鏡面反射している。
    - 地上に投光器が等間隔で配置されている。
  - point_id: HP-003
    location: 追手門前外堀・公園側
    time: '20:02'
    statements:
    - 傾斜のある樹木がライトアップされている。
    - 樹木に切断跡と苔が確認できる。
    - 斜面に「立入禁止」の白い立て看板が設置されている。
    - 奥の園路沿いに縦長のぼり旗が設置されている。
    - 竹製の四つ目垣と生垣が連続している。
  - point_id: HP-004
    location: 追手門
    time: '20:02'
    statements:
    - 追手門および白壁・黒板塀が青色・暖色系の照明でライトアップされている。
    - 石垣前に案内板が設置されている。
    - 土手斜面に白い札が確認できる。
    - 観測時点で物理的な封鎖柵は確認されなかった。
  - point_id: HP-005
    location: 追手門〜植物園南案内所
    time: '20:03'
    statements:
    - 直線状の園路の両側に足元灯が連続して配置されている。
    - 周辺樹木は黄葉・落葉状態にある。
    - 右手前に高所の街路灯が1基設置されている。
    - 左手前に柱状の案内標識が設置されている。
    - 遠方に人物2名を確認した。
  - point_id: HP-006
    location: 杉の大杉から植物園側
    time: '20:07'
    statements:
    - 堀の水面に落葉が浮遊している。
    - 水面にライトアップが反射している。
    - 手前の土手上に太い切断幹と落葉樹が確認できる。
    - 奥に赤く紅葉した樹木と、等間隔に配置された投光器群が確認できる。
  - point_id: HP-007
    location: 二の丸未申櫓工事現場
    time: '20:09'
    statements:
    - 白い仮囲いと伸縮式ゲートによって通行が遮断されている。
    - 工事看板が設置されている。
    - statement: 工事看板の記載内容は以下のとおり。
      details:
      - '工事件名: 令和8年度 重要文化財弘前城二の丸未申櫓災害復旧工事'
      - '施工: 株式会社 西村組'
      - '工期: 令和8年9月10日〜令和9年3月30日'
    - 「24時間監視 防犯カメラ」のステッカーが貼付されている。
  - point_id: HP-008
    location: 本丸天守周辺（曳屋・移動工事状態）
    time: '20:13'
    statements:
    - 天守下部に赤色の鉄骨受け梁と木製ジャッキ（架台）が挿入されている。
    - 天守は持ち上げられた状態でライトアップされている。
    - 大型伸縮ゲートが設置され、本丸エリアは観測時点で夜間閉鎖されている。
  - point_id: HP-009
    location: 本丸蓮沼方向
    time: '20:16'
    statements:
    - 鮮やかな赤色に紅葉したカエデ類と黄葉した樹木の対比が確認できる。
    - 石垣、地表に堆積した大量の落葉が確認できる。
    - 小型投光器および行灯風デザインの照明が配置されている。
  - point_id: HP-010
    location: 東内門・中堀側
    time: '20:20'
    statements:
    - 中堀沿いの樹木が強い赤色の照明でライトアップされている。
    - 水面に照明が反射している。
    - 「RETURN」の文字が型抜きされた特設行灯照明が設置されている。
    - 家紋が型抜きされた特設行灯照明が設置されている。
    - 球状の装飾オブジェが配置されている。
  - point_id: HP-011
    location: 東内門付近（工事・仮設足場エリア）
    time: '20:22'
    statements:
    - 修復工事に伴う仮設足場とシート養生が確認できる。
    - 別アングルでは「桜ミク」の大型ラッピングシートが掲出されている。
  - point_id: HP-012
    location: 南内門と杉の大杉側の紅葉
    time: '20:27'
    statements:
    - 南内門の白壁が照明によって発光している。
    - 門越しに赤く紅葉した樹木が見える構図を確認した。
    - 周辺樹木には紅葉・黄葉のグラデーションが見られる。
    - 案内看板が設置されている。
